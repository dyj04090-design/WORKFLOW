<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Hindsight: regretting a decision only after seeing the outcome</title>
<desc id="desc">Two-panel illustration. On a sunny morning, a person walks past an umbrella thinking he does not need it. Later, soaked in a rainstorm, he realizes he should have taken the umbrella.</desc>
<defs>
  <linearGradient id="leftbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6ce"/><stop offset="1" stop-color="#f8cf9b"/></linearGradient>
  <linearGradient id="rightbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6c9d8"/><stop offset="1" stop-color="#537eaa"/></linearGradient>
  <linearGradient id="jacket" x1="0" x2="1"><stop stop-color="#355478"/><stop offset="1" stop-color="#223750"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#23344c" flood-opacity=".16"/></filter>
  <pattern id="rain" width="65" height="79" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><path d="M13 2v38M46 47v31" stroke="#e9f7ff" stroke-width="5" opacity=".64" stroke-linecap="round"/></pattern>
</defs>
<rect width="1200" height="700" rx="30" fill="#f7f8fc"/>
<rect x="26" y="28" width="559" height="638" rx="27" fill="url(#leftbg)"/>
<rect x="615" y="28" width="559" height="638" rx="27" fill="url(#rightbg)"/>
<!-- Time tags -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="800">
  <rect x="51" y="51" width="171" height="57" rx="17" fill="#fff" opacity=".92"/>
  <text x="136" y="89" text-anchor="middle" fill="#b56c18" font-size="34">BEFORE</text>
  <rect x="640" y="51" width="151" height="57" rx="17" fill="#eff8ff" opacity=".95"/>
  <text x="715" y="89" text-anchor="middle" fill="#325c86" font-size="34">AFTER</text>
</g>
<!-- Sunny left panel -->
<circle cx="468" cy="155" r="69" fill="#fff4a1"/>
<g stroke="#ffe59d" stroke-width="11" stroke-linecap="round">
  <path d="M468 65v-14M468 258v16M365 155h-16M572 155h-16M396 86l-14 -14M540 227l13 13M541 85l13 -13M394 227l-13 13"/>
</g>
<path d="M45 530C170 500 402 508 567 525v141H45z" fill="#e8b985" opacity=".55"/>
<!-- Door and neglected umbrella -->
<rect x="61" y="193" width="189" height="340" rx="11" fill="#a97958"/>
<rect x="77" y="210" width="156" height="324" rx="8" fill="#e2a67a"/>
<rect x="93" y="228" width="124" height="307" rx="6" fill="#b67f5c"/>
<circle cx="193" cy="380" r="9" fill="#f9df9c"/>
<g transform="translate(259 312)">
  <path d="M6 36Q75 -40 144 36Q115 27 91 40Q69 24 51 41Q33 26 6 36Z" fill="#eb6a4d" stroke="#c54d3c" stroke-width="5"/>
  <path d="M75 3v211q0 32 25 25q19 -6 13 -25" fill="none" stroke="#584841" stroke-width="10" stroke-linecap="round"/>
  <path d="M75 9q26 10 39 36" fill="none" stroke="#ffad89" stroke-width="6"/>
</g>
<!-- Person (before) -->
<g transform="translate(415 252)">
  <ellipse cx="39" cy="296" rx="72" ry="15" fill="#b08a69" opacity=".25"/>
  <path d="M-9 191l-13 88q-2 15 14 18h32l24-107M64 190l25 89q4 15-14 18H48L31 188" fill="#424554" stroke="#324051" stroke-width="5"/>
  <path d="M-10 85q20-30 76-11q29 13 25 50l-12 90H-27l-11-92q-1-24 28-37z" fill="url(#jacket)"/>
  <path d="M-26 111l-23 67M79 108l29 47" stroke="#355478" stroke-width="25" stroke-linecap="round"/>
  <rect x="9" y="47" width="28" height="38" rx="10" fill="#f4b98b"/>
  <ellipse cx="23" cy="30" rx="46" ry="54" fill="#f4b98b"/>
  <path d="M-25 25Q-34 -36 20 -32q51 -5 48 53q-13 -13 -19 -36q-39 27 -74 40Z" fill="#38323a"/>
  <circle cx="8" cy="34" r="4.5" fill="#33323a"/>
  <circle cx="41" cy="34" r="4.5" fill="#33323a"/>
  <path d="M18 55q10 8 22 1" fill="none" stroke="#a76a58" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- Left speech bubble -->
<g filter="url(#shadow)">
  <rect x="74" y="115" width="298" height="75" rx="26" fill="#fff" opacity=".97"/>
  <path d="M312 185l30 29-2-32" fill="#fff"/>
</g>
<text x="223" y="162" text-anchor="middle" font-size="27" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#765135">"I won't need it."</text>
<!-- Right rain sky -->
<rect x="618" y="180" width="554" height="486" rx="22" fill="url(#rain)" opacity=".84"/>
<path d="M625 515Q762 480 893 510Q1030 478 1162 525v140H625Z" fill="#52769c" opacity=".55"/>
<ellipse cx="913" cy="608" rx="188" ry="24" fill="#bddcf0" opacity=".48"/>
<path d="M835 619q73-16 145 0" stroke="#e5f6ff" stroke-width="7" opacity=".68" stroke-linecap="round"/>
<!-- Clouds -->
<g fill="#385d82" opacity=".82">
 <path d="M793 195q-31-45 12-69q28-17 56 4q26-44 68-19q24 14 24 43q52-20 71 20q14 30-12 53H794q-38-9-1-32Z"/>
 <path d="M1014 236q-27-36 6-57q17-14 45-3q18-33 51-18q26 14 22 42q30-7 37 17q8 28-19 34h-122Z"/>
</g>
<!-- Person after, same outfit, wet -->
<g transform="translate(801 264)">
  <ellipse cx="65" cy="325" rx="98" ry="17" fill="#335775" opacity=".35"/>
  <path d="M26 212l-17 102h42l33-100M106 214l39 100h-42L70 208" fill="#263b54" stroke="#1f3349" stroke-width="6"/>
  <path d="M6 97q29-20 91-17q31 10 43 48l-6 112H-11L-15 137q-3-27 21-40Z" fill="url(#jacket)" stroke="#19334d" stroke-width="7"/>
  <path d="M-5 139l-24 72M128 141l24 63" stroke="#233f5d" stroke-width="28" stroke-linecap="round"/>
  <rect x="46" y="60" width="33" height="42" rx="11" fill="#e1ae90"/>
  <ellipse cx="60" cy="45" rx="53" ry="65" fill="#e1ae90"/>
  <path d="M7 37Q2-31 59-26q62 3 50 69Q90 10 82-10Q50 17 7 37Z" fill="#263342"/>
  <path d="M27 44l10 5M76 48l11-4" stroke="#293342" stroke-width="5" stroke-linecap="round"/>
  <path d="M49 79q12-7 25 0" stroke="#916557" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M36-3l-10 20M68-9l-6 20M93 0l-8 18M21 111l-9 17M110 123l-12 24M53 155l-11 19M85 207l-7 18" stroke="#9ceaff" stroke-width="6" opacity=".93" stroke-linecap="round"/>
</g>
<!-- After speech bubble -->
<g filter="url(#shadow)">
 <rect x="786" y="108" width="340" height="91" rx="26" fill="#fff" opacity=".97"/>
 <path d="M840 192l-11 28 39-27" fill="#fff"/>
</g>
<text x="956" y="148" font-size="28" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#254d74">"I should've</text>
<text x="956" y="181" font-size="28" font-weight="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="#254d74">taken my umbrella!"</text>
<!-- Time progression between panels -->
<g filter="url(#shadow)">
<circle cx="600" cy="354" r="51" fill="#fff"/>
<path d="M579 355h44m-18-19 19 19-19 19" fill="none" stroke="#6880b5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- Caption on foreground for clear lexical association -->
<rect x="318" y="606" width="580" height="68" rx="22" fill="#fff" stroke="#dde5f2" stroke-width="3" filter="url(#shadow)"/>
<text x="608" y="649" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#233854">IN HINDSIGHT...</text>
</svg>